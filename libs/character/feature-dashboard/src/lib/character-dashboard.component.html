<section class="character-dashboard-container">
  <!-- Unauthenticated / Unauthorized States (Full-width gate) -->
  @if (authState.authStatus() !== 'authenticated') {
    <character-auth-card
      [user]="authState.user()"
      [authStatus]="authState.authStatus()"
      (loginRequested)="onLogin()"
    ></character-auth-card>
  } @else {
    <!-- Authenticated View: Minimalist Top Utility Bar -->
    <header class="dashboard-top-bar">
      <div class="brand-subtle">LifeForge</div>
      <button type="button" class="btn-signout" (click)="onLogout()">
        Sign Out
      </button>
    </header>

    <div class="dashboard-grid">
      <div class="sheet-column">
        <character-sheet [character]="characterState.character()"></character-sheet>
      </div>

      <div class="actions-column">
        @if (globalFeedbackMessage(); as feedback) {
          <div class="global-feedback-banner">
            {{ feedback }}
          </div>
        }

        <div class="focus-quests-section">
          <character-daily-study-quest-card
            [course]="courseState.activeCourse()"
            [progress]="courseState.activeCourseProgress()"
            [nextItem]="courseState.nextUpItem()"
            [isDailyQuestDone]="courseState.isDailyQuestDoneToday()"
            [availableCourses]="courseState.courses()"
            (completeNextLessonRequested)="onCompleteNextLesson($event)"
            (selectCourseRequested)="selectCourse($event)"
            (openImportCourseRequested)="openCourseImportModal()"
          ></character-daily-study-quest-card>

          <character-daily-reading-quest-card
            [activeBook]="activeBookForQuest()"
            [readingBooks]="bookState.currentlyReadingBooks()"
            (completeReadingQuestRequested)="onCompleteReadingQuest($event)"
            (selectBookRequested)="selectBookForQuest($event)"
            (openAddBookRequested)="openAddBookModal()"
          ></character-daily-reading-quest-card>

          <character-daily-wakeup-quest-card
            [evaluation]="currentEvaluation()"
            [formattedTime]="formattedCurrentTime()"
            [claimedToday]="claimedToday()"
            [timeSlots]="timeSlots"
            [claimMessage]="claimMessage()"
            [simulatedHour]="simulatedHour()"
            [simulatedMinute]="simulatedMinute()"
            (claimRequested)="claimEarlyWakeUpXp()"
            (setSimulatedTimeRequested)="setSimulatedTime($event.hour, $event.minute)"
            (resetSimulationRequested)="resetSimulation()"
          ></character-daily-wakeup-quest-card>
        </div>

        <div class="drawers-section">
          <character-course-curriculum-drawer
            [course]="courseState.activeCourse()"
            [progress]="courseState.activeCourseProgress()"
            (itemClicked)="openCourseCheckin({ courseId: courseState.activeCourse()!.id, item: $event.item, module: $event.module })"
          ></character-course-curriculum-drawer>

          <character-reading-shelf-drawer
            [currentlyReadingBooks]="bookState.currentlyReadingBooks()"
            [completedBooks]="completedBooksInSelectedMonth()"
            [selectedMonth]="selectedMonth()"
            [selectedYear]="selectedYear()"
            [monthOptions]="monthOptions"
            (addBookRequested)="onAddBook($event)"
            (selectBookForQuestRequested)="selectBookForQuest($event)"
            (monthChanged)="selectedMonth.set($event)"
            (yearChanged)="selectedYear.set($event)"
          ></character-reading-shelf-drawer>

          <character-xp-analytics-drawer
            [recentEvents]="recentXpEvents()"
            [totalEventsCount]="totalXpEventsCount()"
          ></character-xp-analytics-drawer>
        </div>
      </div>
    </div>
  }

  <character-course-import-modal
    [isOpen]="isCourseImportModalOpen()"
    (closed)="closeCourseImportModal()"
    (imported)="importScrapedCourse($event)"
  ></character-course-import-modal>

  <character-course-item-checkin-modal
    [isOpen]="isCourseCheckinModalOpen()"
    [item]="selectedCheckinItem()"
    [module]="selectedCheckinModule()"
    [course]="courseState.activeCourse()"
    [isCompleted]="selectedCheckinItem() ? courseState.activeCourseProgress().completedItemIds.includes(selectedCheckinItem()!.id) : false"
    (closed)="closeCourseCheckinModal()"
    (submitted)="submitCourseItemCheckin($event)"
  ></character-course-item-checkin-modal>
</section>
